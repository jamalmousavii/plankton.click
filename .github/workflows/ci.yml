name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (tests + syntax)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plankton
          POSTGRES_PASSWORD: plankton
          POSTGRES_DB: plankton_it
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Enables tests/integration.money.test.js (real-DB money path).
      # Without it those tests skip, so local `npm test` needs no database.
      DATABASE_URL: postgresql://plankton:plankton@localhost:5432/plankton_it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check (all sources)
        run: |
          set -e
          for f in $(find src -name '*.js'); do node --check "$f"; done
          echo "all files parse"
      - name: Unit + integration tests
        run: npm test

  frontend:
    name: Frontend (build + i18n gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: i18n gate (all locales, all keys)
        run: npm run i18n:check
      - name: Unit tests (jest)
        run: npm test
      - run: npm run build
      - run: npm run lint

  scripts:
    name: Install scripts (shellcheck + node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ShellCheck (all install/uninstall scripts)
        run: |
          set -e
          command -v shellcheck >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck)
          shellcheck --version | head -2
          shellcheck worker-app/*.sh
          echo "shellcheck clean"
      - name: Syntax check (worker-app sources)
        run: |
          set -e
          for f in $(find worker-app/src -name '*.js'); do node --check "$f"; done
          echo "worker-app sources parse"

  worker-platforms:
    name: Worker installers (macOS + Windows)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # macOS: the stock bash 3.2 must still parse the scripts (the re-exec
      # guard runs later); then exercise the manager menu against a fake HOME.
      - name: Validate macOS scripts
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          bash -n worker-app/install-macos.sh
          bash -n worker-app/uninstall-macos.sh
          /bin/bash -n worker-app/install-macos.sh
          mkdir -p "$RUNNER_TEMP/fakehome/plankton-worker/worker-app"
          printf '{"models":"llama3.1:8b","default_model":"llama3.1:8b","worker_token":"pw_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","name":"t"}' \
            > "$RUNNER_TEMP/fakehome/plankton-worker/worker-app/config.json"
          printf '0\n' | HOME="$RUNNER_TEMP/fakehome" bash worker-app/install-macos.sh | grep -q "Plankton Worker Manager"
          echo "macos scripts OK"
      # Windows: no shellcheck/pssa needed — the .NET parser is built in.
      - name: Validate PowerShell scripts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $files = @('worker-app/install-windows.ps1', 'worker-app/uninstall-windows.ps1')
          $failed = $false
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$f : $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "ps1 parse clean"
