# Plankton Network - Nginx Config (WebSocket on port 443)
# Deploy: cp plankton-nginx.conf /etc/nginx/sites-available/plankton && nginx -t && systemctl reload nginx
#
# NOTE: limit_req_zone / limit_conn_zone live in the http context — this file
# is included from nginx.conf's http block (sites-enabled), not inside server{}.

limit_req_zone  $binary_remote_addr zone=plankton_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=plankton_conn:10m;

server {
    listen 80;
    # IPv4-only policy: no [::]:80 listen, so no IPv6 response at all.
    server_name plankton.click www.plankton.click;
    # Hardcode the apex: http://www.plankton.click/... jumps straight to
    # https://plankton.click/... (single hop) instead of https://www first.
    return 301 https://plankton.click$request_uri;
}

# NOTE (IPv4-only policy): the old sslip.io IPv6 bypass (:80 + :443 twins for
# 2a01-4f9-c011-4cf0--1.sslip.io) was removed. That host only resolves to IPv6
# and is unreachable once IPv6 is disabled. Policy: only 80/443 are served —
# the old extra TLS ports (2053/2083/2087/2096/8443) were dropped, and so was
# the localhost.run (lhr.life) tunnel block.

server {
    # IPv4-only policy: no [::]:443 listen.
    # Policy: only 443 is served — no extra TLS ports (2053/2083/2087/2096/8443).
    listen 443 ssl;
    http2 on;
    server_name plankton.click;

    # Attachments (images / PDFs / voice notes) ride base64 inside the chat
    # JSON body — nginx's 1 MB default would 413 them before express sees them.
    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/plankton.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plankton.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # plankton.click is proxied through Cloudflare, so every request used to arrive
    # from a CF edge IP. Without this, limit_req/limit_conn and express-rate-limit
    # were keyed by *edge* IPs: no effective per-user throttle, plus one busy edge
    # could throttle many unrelated users at once. CF overwrites
    # CF-Connecting-IP, and direct-to-origin requests are not in these ranges,
    # so the header cannot be spoofed from outside Cloudflare.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 141.101.77.0/22;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Every proxy_set_header X-Forwarded-For below forwards only $remote_addr
    # (already verified above). Express runs with `trust proxy 1`, so req.ip =
    # that single entry = the real visitor → per-user rate limits actually bind.

    limit_conn plankton_conn 60;

    # NOTE: nginx drops add_header directives inherited from this level in any
    # location that declares its own add_header — repeat the set where needed.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Inline script/style is required by Next.js; Google Sign-In is the only
    # third party allowed to execute or be framed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://plankton.click wss://plankton.click; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # WebSocket endpoint (must be HTTP/1.1 + Upgrade headers)
    location /ws {
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        # Per-IP ceiling in front of express-rate-limit (which only kicks in
        # after the request has been parsed by Node). Generous: real chat
        # traffic never exceeds a few r/s.
        limit_req zone=plankton_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        # CPU worker inference can take ~2 min (model load + generate)
        proxy_read_timeout 300s;
    }

    # Coder API (v3.43.0, agent loops): same backend, generous timeouts.
    location /v1/ {
        limit_req zone=plankton_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    location @fallback {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        expires 365d;
        # own add_header set → repeat the server-level security headers
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

# Canonical host: www is not a second copy of the site — 301 to the apex so
# SEO/link equity consolidates on https://plankton.click (HSTS includeSubDomains
# already covers www via the apex headers).
server {
    # IPv4-only policy: no [::]:443 listen.
    listen 443 ssl;
    http2 on;
    server_name www.plankton.click;

    ssl_certificate /etc/letsencrypt/live/plankton.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plankton.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://plankton.click$request_uri;
}

# NOTE: only 80/443 are served — the old extra-port `listen`s
# (2053/2083/2087/2096/8443) were removed by policy.
# Browser WebSocket is on 443 (/ws); backend WS listens on 127.0.0.1:8444 internally.

# ---------------------------------------------------------------------------
# ws.plankton.click — direct worker endpoint (1.1.11)
# ---------------------------------------------------------------------------
# DNS-only record (grey cloud, NOT proxied by Cloudflare) pointing at this
# box. Workers try it first and fall back to wss://plankton.click/ws: some
# networks/VPNs cut long-lived connections through the Cloudflare proxy, and
# a dropped socket mid-task costs the user the answer. Only /ws (and /health)
# are served here — the site and the API stay behind Cloudflare.
#
# First issue: deploy the :80 block alone, reload, then
#   certbot certonly --webroot -w /var/www/html -d ws.plankton.click
# and add the :443 block (nginx refuses to load a missing certificate).
server {
    listen 80;
    server_name ws.plankton.click;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name ws.plankton.click;

    ssl_certificate /etc/letsencrypt/live/ws.plankton.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.plankton.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Direct clients: $remote_addr is already the real worker IP (no
    # set_real_ip_from here — nothing in front of this vhost is trusted).
    limit_conn plankton_conn 20;

    location /ws {
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / { return 404; }
}
